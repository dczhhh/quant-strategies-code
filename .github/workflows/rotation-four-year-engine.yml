name: Frozen four-year sixteen-account Engine replay

on:
  push:
    branches: [main]
    paths: [.github/workflows/rotation-four-year-engine.yml]

permissions:
  contents: read

concurrency:
  group: real-action-capture-v1
  cancel-in-progress: false

env:
  ENGINE_SOURCE_SHA: '8a5fa6a1605a172b7b2763e7e43a4efe1789f2ca'
  INPUT_QUALIFICATION_RUN_ID: '39393282378'
  ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
  ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}

jobs:
  preflight:
    permissions:
      contents: read
      actions: read
    if: >-
      github.repository == 'dczhhh/quant-strategies-code' &&
      github.actor == 'dczhhh' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ENGINE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - name: Require complete source checks and successful independent input qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/dczhhh/quant-strategies-code/actions/runs?head_sha=$ENGINE_SOURCE_SHA&event=pull_request&per_page=100" > "$RUNNER_TEMP/four-year-engine-checks.json"
          jq --exit-status --arg sha "$ENGINE_SOURCE_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha)] |
            group_by(.name) | map(sort_by(.run_started_at) | last) |
            [.[] | select(.status == "completed" and .conclusion == "success") | .name] |
            index("CI") != null and index("Ecosystem qualification") != null and index("Four-year sixteen-account Engine checks") != null
          ' "$RUNNER_TEMP/four-year-engine-checks.json"
          gh api "repos/dczhhh/quant-strategies-code/actions/runs/$INPUT_QUALIFICATION_RUN_ID" > "$RUNNER_TEMP/four-year-input-qualification.json"
          jq --exit-status '.name == "Frozen four-year continuous input qualification" and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/four-year-input-qualification.json"
      - run: uv run pytest tests/test_rotation_four_year_experiment.py -q --no-cov

  replay:
    needs: preflight
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ENGINE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - name: Rebuild qualified raw inputs and run sixteen continuous accounts
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          PYTHONHASHSEED: '1'
        run: uv run python tools/rotation_four_year_experiment.py run "$ENGINE_SOURCE_SHA"

  verify:
    needs: replay
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ENGINE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - name: Fresh raw-backed sixteen-account reproduction and complete byte comparison
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          PYTHONHASHSEED: '33'
        run: uv run python tools/rotation_four_year_experiment.py verify "$ENGINE_SOURCE_SHA"
