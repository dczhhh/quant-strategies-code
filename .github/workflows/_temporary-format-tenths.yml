name: Temporary decimal-step formatting diff
on:
  push:
    branches: [feat/rotation-share-tenths-20261016]
    paths: [.github/workflows/_temporary-format-tenths.yml]
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uvx ruff==0.14.10 format --diff src/ml4t/backtest/strategies/sector_rotation/research.py tests/strategies/test_rotation_research.py
