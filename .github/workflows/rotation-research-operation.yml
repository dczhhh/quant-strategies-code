name: Fixed Issue 30 gap capture

on:
  push:
    branches: [main]
    paths: [.github/workflows/rotation-research-operation.yml]

permissions:
  contents: read

concurrency:
  group: real-action-capture-v1
  cancel-in-progress: false

env:
  SOURCE_SHA: '7dc70778fe0d1bb4d2a76e9265f6d7d310d541eb'
  ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
  ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}

jobs:
  preflight:
    permissions:
      contents: read
      actions: read
    if: >-
      github.repository == 'dczhhh/quant-strategies-code' &&
      github.actor == 'dczhhh' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - name: Require successful checks on the immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/dczhhh/quant-strategies-code/actions/runs?head_sha=$SOURCE_SHA&event=pull_request&per_page=100" > "$RUNNER_TEMP/stress-source-checks.json"
          jq --exit-status --arg sha "$SOURCE_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success") | .name] |
            index("CI") != null and index("Ecosystem qualification") != null
          ' "$RUNNER_TEMP/stress-source-checks.json"
      - run: uv run pytest tests/test_rotation_stress_capture.py tests/test_rotation_stress_inventory.py -q --no-cov
      - run: uv run ty check tools/rotation_stress_capture.py tools/rotation_stress_inventory.py

  capture:
    needs: preflight
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        ticker: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY, SPY]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - name: Reuse retained groups or reserve only the fixed missing-source group
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE }}
        run: uv run python tools/rotation_stress_capture.py capture "${{ matrix.ticker }}" "$SOURCE_SHA"

  verify:
    needs: capture
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        ticker: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY, SPY]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - name: Fresh read-only source verification without a provider credential
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
        run: uv run python tools/rotation_stress_capture.py verify "${{ matrix.ticker }}" "$SOURCE_SHA"
