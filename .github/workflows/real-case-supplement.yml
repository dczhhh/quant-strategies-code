name: Reviewed reverse-split and reorganization input supplement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-action-capture-v1
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.repository == 'dczhhh/quant-strategies-code' &&
      github.actor == 'dczhhh' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.REAL_CASE_SUPPLEMENT_ENABLED == 'true' &&
      github.sha == vars.REAL_CASE_SUPPLEMENT_REVIEWED_SHA
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [sqqq-reverse, wolf-reorganization]
    env:
      REAL_CASE_SUPPLEMENT_ENABLED: ${{ vars.REAL_CASE_SUPPLEMENT_ENABLED }}
      REAL_CASE_SUPPLEMENT_REVIEWED_SHA: ${{ vars.REAL_CASE_SUPPLEMENT_REVIEWED_SHA }}
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.REAL_CASE_SUPPLEMENT_REVIEWED_SHA }}
          persist-credentials: false
      - name: Validate invented supplemental transport fixtures without credentials
        run: python3 -m unittest tests.test_real_case_supplement -v
      - name: Capture fixed inputs into new immutable private namespace
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE }}
          CAPTURE_GROUP: ${{ matrix.group }}
        run: python3 -I tools/real_case_supplement.py capture "$CAPTURE_GROUP"
      - name: Independent readback without provider credential
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          CAPTURE_GROUP: ${{ matrix.group }}
        run: python3 -I tools/real_case_supplement.py verify "$CAPTURE_GROUP"

  verify:
    needs: capture
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [sqqq-reverse, wolf-reorganization]
    env:
      REAL_CASE_SUPPLEMENT_ENABLED: ${{ vars.REAL_CASE_SUPPLEMENT_ENABLED }}
      REAL_CASE_SUPPLEMENT_REVIEWED_SHA: ${{ vars.REAL_CASE_SUPPLEMENT_REVIEWED_SHA }}
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.REAL_CASE_SUPPLEMENT_REVIEWED_SHA }}
          persist-credentials: false
      - name: Fresh runner read-only replay without provider credential
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          CAPTURE_GROUP: ${{ matrix.group }}
        run: python3 -I tools/real_case_supplement.py verify "$CAPTURE_GROUP"
