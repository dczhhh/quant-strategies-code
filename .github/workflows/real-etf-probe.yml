name: Reviewed issuer files and private ETF return probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-action-capture-v1
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'dczhhh/quant-strategies-code' &&
      github.actor == 'dczhhh' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.REAL_ETF_PROBE_ENABLED == 'true' &&
      github.sha == vars.REAL_ETF_PROBE_REVIEWED_SHA
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REAL_ETF_PROBE_ENABLED: ${{ vars.REAL_ETF_PROBE_ENABLED }}
      REAL_ETF_PROBE_REVIEWED_SHA: ${{ vars.REAL_ETF_PROBE_REVIEWED_SHA }}
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.REAL_ETF_PROBE_REVIEWED_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Install locked fixture dependencies before archive credential exposure
        run: uv sync --dev --locked --python 3.12
      - name: Validate invented source/archive/return fixtures without credentials
        run: uv run python -m unittest tests.test_real_etf_probe -v
      - name: Inspect retained issuer files and unknown reservations without source requests
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
        run: python3 -I tools/real_etf_probe.py inspect
      - name: Recompute report with no source requests
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
        run: python3 -I tools/real_etf_probe.py verify-inspection

  verify:
    needs: probe
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REAL_ETF_PROBE_ENABLED: ${{ vars.REAL_ETF_PROBE_ENABLED }}
      REAL_ETF_PROBE_REVIEWED_SHA: ${{ vars.REAL_ETF_PROBE_REVIEWED_SHA }}
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.REAL_ETF_PROBE_REVIEWED_SHA }}
          persist-credentials: false
      - name: Fresh runner recompute from privately archived bytes only
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
        run: python3 -I tools/real_etf_probe.py verify-inspection
