name: Bear 2022 source checks

on:
  pull_request:
    paths:
      - tools/bear_2022_*.py
      - tests/test_bear_2022_*.py
      - .github/workflows/bear-2022-checks.yml

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - run: uv run ruff format --diff tools/bear_2022_*.py tests/test_bear_2022_*.py
      - run: uv run ruff check --no-fix tools/bear_2022_*.py tests/test_bear_2022_*.py
        if: always()
      - run: uv run ty check tools/bear_2022_*.py
        if: always()
      - run: uv run pytest tests/test_bear_2022_sources.py tests/test_bear_2022_capture.py -q --no-cov
        if: always()
      - name: Standard-library source audit is deterministic across hash seeds
        run: |
          PYTHONHASHSEED=1 uv run python -c 'from tests.test_bear_2022_sources import encoded, fixture, sessions; from tools import bear_2022_sources as s; print(s.digest(s.canonical(s.qualify("SPY", encoded(fixture()), sessions))))' > "$RUNNER_TEMP/bear2022-seed1"
          PYTHONHASHSEED=33 uv run python -c 'from tests.test_bear_2022_sources import encoded, fixture, sessions; from tools import bear_2022_sources as s; print(s.digest(s.canonical(s.qualify("SPY", encoded(fixture()), sessions))))' > "$RUNNER_TEMP/bear2022-seed33"
          cmp "$RUNNER_TEMP/bear2022-seed1" "$RUNNER_TEMP/bear2022-seed33"
        if: always()
