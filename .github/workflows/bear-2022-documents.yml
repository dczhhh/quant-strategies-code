name: Frozen bear 2022 issuer-document evidence

on:
  push:
    branches: [main]
    paths: [.github/workflows/bear-2022-documents.yml]

permissions:
  contents: read

concurrency:
  group: real-action-capture-v1
  cancel-in-progress: false

env:
  DOCUMENT_SOURCE_SHA: '596e4dee030153b1541bc3db61f16ad6dcd5ce02'
  ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
  ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}

jobs:
  preflight:
    permissions:
      contents: read
      actions: read
    if: >-
      github.repository == 'dczhhh/quant-strategies-code' &&
      github.actor == 'dczhhh' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DOCUMENT_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --dev --locked --python 3.12
      - name: Require the exact source revision's complete qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/dczhhh/quant-strategies-code/actions/runs?head_sha=$DOCUMENT_SOURCE_SHA&event=pull_request&per_page=100" > "$RUNNER_TEMP/bear2022-document-checks.json"
          jq --exit-status --arg sha "$DOCUMENT_SOURCE_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha)] |
            group_by(.name) | map(sort_by(.run_started_at) | last) |
            [.[] | select(.status == "completed" and .conclusion == "success") | .name] |
            index("CI") != null and index("Ecosystem qualification") != null and index("Bear 2022 document checks") != null
          ' "$RUNNER_TEMP/bear2022-document-checks.json"
      - run: uv run ruff format --check tools/bear_2022_document*.py tests/test_bear_2022_document*.py
      - run: uv run ruff check --no-fix tools/bear_2022_document*.py tests/test_bear_2022_document*.py
      - run: uv run ty check tools/bear_2022_document*.py
      - run: uv run pytest tests/test_bear_2022_document_plan.py tests/test_bear_2022_documents.py -q --no-cov

  capture:
    needs: preflight
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DOCUMENT_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --dev --locked --python 3.12
      - name: Three fixed public filings, no market key, immutable private evidence
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          PYTHONHASHSEED: '1'
        run: uv run python tools/bear_2022_documents.py capture "$DOCUMENT_SOURCE_SHA"

  fresh_verify:
    needs: capture
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DOCUMENT_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --dev --locked --python 3.12
      - name: Fresh byte-identical evidence rebuild, no source requests or writes
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
          PYTHONHASHSEED: '33'
        run: uv run python tools/bear_2022_documents.py verify "$DOCUMENT_SOURCE_SHA"
