name: Temporary no-secret ablation verification v3
on:
  push:
    branches: [research/rotation-causal-ablation-20261017]
    paths: [.github/workflows/_temporary-ablation-smoke.yml]
permissions:
  contents: read
jobs:
  causal-factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - run: uv run ruff check --diff src/ml4t/backtest/strategies/sector_rotation/research_ablation.py tests/strategies/test_rotation_causal_ablation.py || true
      - run: uv run ruff format --diff src/ml4t/backtest/strategies/sector_rotation/research_ablation.py tests/strategies/test_rotation_causal_ablation.py || true
      - run: uv run ruff check src/ml4t/backtest/strategies/sector_rotation/research_ablation.py tests/strategies/test_rotation_causal_ablation.py
      - run: uv run ruff format --check src/ml4t/backtest/strategies/sector_rotation/research_ablation.py tests/strategies/test_rotation_causal_ablation.py
      - run: uv run pytest tests/strategies/test_rotation_causal_ablation.py -q --no-cov
