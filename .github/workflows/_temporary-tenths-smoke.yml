name: Temporary tenth-share synthetic-only probe

on:
  push:
    branches: [feat/rotation-tenths-stress-20261016]
    paths: [.github/workflows/_temporary-tenths-smoke.yml]

permissions:
  contents: read

jobs:
  synthetic-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - run: uv run ruff check src/ml4t/backtest/strategies/sector_rotation/research.py src/ml4t/backtest/strategies/sector_rotation/research_benchmark.py tools/rotation_stress_tenths_compare.py
      - run: uv run ruff format --check src/ml4t/backtest/strategies/sector_rotation/research.py src/ml4t/backtest/strategies/sector_rotation/research_benchmark.py tools/rotation_stress_tenths_compare.py
      - run: uv run pytest tests/strategies/test_rotation_research.py tests/strategies/test_rotation_assumed_distribution.py -q --no-cov
      - run: uv run ty check tools/rotation_stress_tenths_compare.py
