name: Frequency research checks

on:
  pull_request:
    paths:
      - tools/rotation_frequency_*.py
      - tests/*rotation_frequency*.py
      - .github/workflows/rotation-frequency-checks.yml

permissions:
  contents: read

jobs:
  frequency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - run: uv run ruff format --diff tools/rotation_frequency_*.py tests/*rotation_frequency*.py
      - run: uv run ruff check --no-fix tools/rotation_frequency_*.py tests/*rotation_frequency*.py
        if: always()
      - run: uv run ty check tools/rotation_frequency_*.py
        if: always()
      - run: uv run pytest tests/test_rotation_frequency.py -q --no-cov
        if: always()
      - run: uv run python -m tests.rotation_frequency_process_probe compare
        if: always()
