name: Four-year input cash and settlement checks

on:
  pull_request:
    paths:
      - tools/rotation_four_year_gap_audit.py
      - tools/rotation_four_year_settlement.py
      - tests/test_rotation_four_year_gap_audit.py
      - tests/test_rotation_four_year_settlement.py
      - config/research/rotation_four_year_settlement.json
      - docs/examples/rotation-four-year-input-audit.yml
      - .github/workflows/rotation-four-year-input-audit-checks.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - run: uv run ruff format --check tools/rotation_four_year_gap_audit.py tools/rotation_four_year_settlement.py tests/test_rotation_four_year_gap_audit.py tests/test_rotation_four_year_settlement.py
      - run: uv run ruff check --no-fix tools/rotation_four_year_gap_audit.py tools/rotation_four_year_settlement.py tests/test_rotation_four_year_gap_audit.py tests/test_rotation_four_year_settlement.py
        if: always()
      - run: uv run ty check tools/rotation_four_year_gap_audit.py tools/rotation_four_year_settlement.py
        if: always()
      - run: uv run pytest tests/test_rotation_four_year_gap_audit.py tests/test_rotation_four_year_settlement.py tests/test_rotation_four_year_capture.py tests/test_rotation_four_year_inventory.py -q --no-cov
        if: always()
