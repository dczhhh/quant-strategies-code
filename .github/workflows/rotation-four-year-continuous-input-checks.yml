name: Four-year continuous input rebuild checks

on:
  pull_request:
    paths:
      - tools/rotation_four_year_inputs.py
      - tools/rotation_four_year_input_archive.py
      - tests/test_rotation_four_year_inputs.py
      - tests/test_rotation_four_year_input_archive.py
      - .github/workflows/rotation-four-year-continuous-input-checks.yml

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - run: uv run ruff format --check tools/rotation_four_year_inputs.py tools/rotation_four_year_input_archive.py tests/test_rotation_four_year_inputs.py tests/test_rotation_four_year_input_archive.py
      - run: uv run ruff check --no-fix tools/rotation_four_year_inputs.py tools/rotation_four_year_input_archive.py tests/test_rotation_four_year_inputs.py tests/test_rotation_four_year_input_archive.py
        if: always()
      - run: uv run ty check tools/rotation_four_year_inputs.py tools/rotation_four_year_input_archive.py
        if: always()
      - run: uv run pytest tests/test_rotation_four_year_inputs.py tests/test_rotation_four_year_input_archive.py tests/test_rotation_four_year_annual.py tests/test_rotation_four_year_gap_audit.py tests/test_rotation_four_year_settlement.py tests/test_rotation_four_year_capture.py tests/test_rotation_four_year_inventory.py tests/test_rotation_four_year_matrix.py -q --no-cov
        if: always()
