name: Reviewed retained 2025 ETF raw-basis audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-action-capture-v1
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.repository == 'dczhhh/quant-strategies-code' &&
      github.actor == 'dczhhh' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.REAL_ETF_PROBE_ENABLED == 'true' &&
      github.sha == vars.REAL_ETF_PROBE_REVIEWED_SHA
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REAL_ETF_PROBE_ENABLED: ${{ vars.REAL_ETF_PROBE_ENABLED }}
      REAL_ETF_PROBE_REVIEWED_SHA: ${{ vars.REAL_ETF_PROBE_REVIEWED_SHA }}
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.REAL_ETF_PROBE_REVIEWED_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Install invented-fixture dependencies before credential exposure
        run: uv sync --dev --locked --python 3.12
      - name: Check raw-share and immutable-cache regressions
        run: uv run python -m unittest tests.test_real_etf_2025_audit -v
      - name: Audit all 12 targets from retained inputs only
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
        run: python3 -I tools/real_etf_2025_audit.py audit

  verify:
    needs: audit
    environment: private-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REAL_ETF_PROBE_ENABLED: ${{ vars.REAL_ETF_PROBE_ENABLED }}
      REAL_ETF_PROBE_REVIEWED_SHA: ${{ vars.REAL_ETF_PROBE_REVIEWED_SHA }}
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.REAL_ETF_PROBE_REVIEWED_SHA }}
          persist-credentials: false
      - name: Fresh runner recomputes the entire private report bundle read-only
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_WRITE_TOKEN: ${{ secrets.ARCHIVE_WRITE_TOKEN }}
        run: python3 -I tools/real_etf_2025_audit.py verify
