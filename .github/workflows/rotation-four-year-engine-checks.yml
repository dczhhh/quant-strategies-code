name: Four-year sixteen-account Engine checks

on:
  pull_request:
    paths:
      - tools/rotation_four_year_experiment.py
      - tools/rotation_four_year_metrics.py
      - tools/rotation_four_year_spy_recovery.py
      - tests/test_rotation_four_year_experiment.py
      - tests/test_rotation_four_year_spy_recovery.py
      - .github/workflows/rotation-four-year-engine-checks.yml

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --dev --locked --python 3.12
      - run: uv run ruff format --check tools/rotation_four_year_experiment.py tools/rotation_four_year_metrics.py tools/rotation_four_year_spy_recovery.py tests/test_rotation_four_year_experiment.py tests/test_rotation_four_year_spy_recovery.py
      - run: uv run ruff check --no-fix tools/rotation_four_year_experiment.py tools/rotation_four_year_metrics.py tools/rotation_four_year_spy_recovery.py tests/test_rotation_four_year_experiment.py tests/test_rotation_four_year_spy_recovery.py
        if: always()
      - run: uv run ty check tools/rotation_four_year_experiment.py tools/rotation_four_year_metrics.py tools/rotation_four_year_spy_recovery.py
        if: always()
      - run: uv run pytest tests/test_rotation_four_year_experiment.py tests/test_rotation_four_year_spy_recovery.py tests/test_rotation_four_year_matrix.py tests/test_rotation_four_year_inputs.py tests/test_rotation_four_year_input_archive.py -q --no-cov
        if: always()
